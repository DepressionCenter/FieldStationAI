# This file is part of Field Station AI
# .github/workflows/tests.yml
# Author(s): Gabriel Mongefranco.
# Created: 2026-09-23
# Last Modified: 2026-10-08
# Summary: Runs the test suite on every pull request and on every push to
# main. The static job installs nothing: it checks the documentation, the
# single-file app, and the crisis check's regex tier with Node's own test
# runner. The models job installs the one test dependency and scores the
# crisis prompt fixture with the real embedding and tiebreak models, the
# skill offer prompt fixture with the real embedding model, and synthetic
# passages with the real reranker, on the CPU, caching the model files
# between runs. Nothing here publishes, writes to the repository, or needs
# a secret.
# Notes: See README file for documentation and full license information.
